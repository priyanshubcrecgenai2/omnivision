<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" role="img" aria-labelledby="title desc">
  <title id="title">Omnivision</title>
  <desc id="desc">Omnivision optical target and engineering studio wordmark in pure monochrome</desc>
  
  <!-- Optical Reticle Mark (Monochrome White on Black) -->
  <g transform="translate(15, 15)">
    <!-- Outer tracking box corners -->
    <path d="M 12,28 L 12,14 A 2,2 0 0,1 14,12 L 28,12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 78,12 L 92,12 A 2,2 0 0,1 94,14 L 94,28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 94,62 L 94,76 A 2,2 0 0,1 92,78 L 78,78" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28,78 L 14,78 A 2,2 0 0,1 12,76 L 12,62" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Outer concentric ring -->
    <circle cx="53" cy="45" r="30" fill="none" stroke="#333333" stroke-width="1.5"/>
    <!-- Segmented aperture ring -->
    <circle cx="53" cy="45" r="23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="14 7 24 5"/>
    <!-- Inner optical core -->
    <circle cx="53" cy="45" r="9" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="53" cy="45" r="3" fill="#ffffff"/>
    <!-- Crosshairs -->
    <line x1="53" y1="17" x2="53" y2="25" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="53" y1="65" x2="53" y2="73" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="25" y1="45" x2="33" y2="45" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="73" y1="45" x2="81" y2="45" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  
  <!-- Wordmark -->
  <text x="135" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">OMNIVISION</text>
  <text x="137" y="82" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="0.28em">COMPUTER VISION &amp; AI SYSTEMS</text>
</svg>
